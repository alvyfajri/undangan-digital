    <svg class="cloud cover__cloud cover__cloud--tr" aria-hidden="true"><use href="#mm-2"/></svg>
    <svg class="cloud cover__cloud cover__cloud--bl" aria-hidden="true"><use href="#mm-3"/></svg>
    <svg class="cloud cover__cloud cover__cloud--br" aria-hidden="true"><use href="#mm-3"/></svg>
    <div class="cover__sky">
      <p class="eyebrow" data-cover-item>Undangan Pernikahan</p>
      <h1 class="script cover__names" id="cover-names" data-cover-item>
        <span data-urut="pria" data-bind="pria.panggilan"></span>
        <span class="amp">&amp;</span>
        <span data-urut="wanita" data-bind="wanita.panggilan"></span>
      </h1>
      <p class="cover__date" id="cover-date" data-cover-item></p>
    </div>

    <!-- Gerbang Keraton Kasepuhan (Cirebon) -->
    <div class="gate" id="gate">
      <div class="gate__art" data-orn="gate"></div>
      <div class="gate__light" aria-hidden="true"></div>
      <div class="gate__door">
        <p class="cover__guest" data-door-item>
          Kepada Yth.
          <strong class="cover__guest-name" id="guest-name">Bapak/Ibu/Saudara/i</strong>
          <span class="cover__guest-note">di tempat</span>
        </p>
        <button class="btn btn--gold cover__open" id="open-btn" type="button" data-door-item>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Buka Undangan
        </button>
      </div>
    </div>
    <div class="waves cover__waves" data-orn="waves"></div>
  </div>

  <!-- ============ ISI UNDANGAN ============ -->
  <main class="app" id="app" aria-hidden="true">

    <!-- Salam & ayat & mempelai -->
    <section class="sec sec--paper salam" id="salam">
      <svg class="cloud cloud--soft salam__cloud salam__cloud--l" data-parallax="-18" aria-hidden="true"><use href="#mm"/></svg>
      <svg class="cloud cloud--soft salam__cloud salam__cloud--r" data-parallax="-30" aria-hidden="true"><use href="#mm-2"/></svg>

      <div class="wk salam__flower" data-orn="flower" data-leaves data-bloom></div>
      <p class="salam__greet" data-reveal data-bind="teks.salamPembuka"></p>

      <figure class="ayat" data-reveal>
        <div class="ayat__frame" data-orn="wadasan"></div>
        <p class="ayat__arab" lang="ar" dir="rtl" data-bind="teks.ayatArab"></p>
        <blockquote class="ayat__arti" data-bind="teks.ayatArti"></blockquote>
        <figcaption class="ayat__src" data-bind="teks.ayatSumber"></figcaption>
      </figure>

      <p class="salam__intro" data-reveal data-bind="teks.pengantar"></p>

      <div class="couple">
        <article class="person" data-reveal data-urut="pria">
          <span class="person__origin" data-bind="pria.asal"></span>
          <h2 class="script person__nick" data-bind="pria.panggilan"></h2>
          <p class="person__full" data-bind="pria.lengkap"></p>
          <p class="person__parents">
            <span data-bind="pria.keterangan"></span><br>
            <span data-bind="pria.ayah"></span> &amp; <span data-bind="pria.ibu"></span>
          </p>
        </article>

        <div class="couple__amp script" data-reveal aria-hidden="true">&amp;</div>

        <article class="person" data-reveal data-urut="wanita">
          <span class="person__origin person__origin--sea" data-bind="wanita.asal"></span>
          <h2 class="script person__nick" data-bind="wanita.panggilan"></h2>
          <p class="person__full" data-bind="wanita.lengkap"></p>
          <p class="person__parents">
            <span data-bind="wanita.keterangan"></span><br>
            <span data-bind="wanita.ayah"></span> &amp; <span data-bind="wanita.ibu"></span>
          </p>
        </article>
      </div>
    </section>

    <!-- Acara: langit bertemu laut -->
    <section class="sec sec--sky acara" id="acara">
      <svg class="cloud acara__cloud acara__cloud--l" data-parallax="-25" aria-hidden="true"><use href="#mm-3"/></svg>
      <svg class="cloud acara__cloud acara__cloud--r" data-parallax="-12" aria-hidden="true"><use href="#mm"/></svg>

      <p class="eyebrow" data-reveal>Waktu &amp; Tempat</p>
      <h2 class="sec__title script" data-reveal>Hari Bahagia</h2>
      <div class="events" id="events"></div>

      <div class="waves acara__waves" data-orn="waves"></div>
    </section>

    <!-- Galeri -->
    <section class="sec sec--paper galeri" id="galeri">
      <p class="eyebrow eyebrow--ink" data-reveal>Galeri</p>
      <h2 class="sec__title sec__title--ink script" data-reveal>Momen Kami</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- Amplop -->
    <section class="sec sec--sky amplop" id="amplop">
      <svg class="cloud amplop__cloud" data-parallax="-20" aria-hidden="true"><use href="#mm-2"/></svg>
      <p class="eyebrow" data-reveal>Tanda Kasih</p>
      <h2 class="sec__title script" data-reveal>Amplop Digital</h2>
      <p class="amplop__intro" data-reveal data-bind="teks.amplopPengantar"></p>
      <div class="gifts" id="gifts"></div>
      <figure class="qris" id="qris" hidden data-reveal>
        <img alt="QRIS" id="qris-img" loading="lazy" decoding="async">
        <figcaption>Pindai QRIS</figcaption>
      </figure>
    </section>

    <!-- Ucapan & Doa (disimpan di SQLite lewat api/ucapan.php) -->
    <section class="sec sec--paper ucapan" id="ucapan">
      <p class="eyebrow eyebrow--ink" data-reveal>Doa Restu</p>
      <h2 class="sec__title sec__title--ink script" data-reveal>Ucapan &amp; Doa</h2>
      <p class="ucapan__intro" data-reveal data-bind="teks.ucapanPengantar"></p>

      <form class="wish-form" id="wish-form" data-reveal novalidate>
        <label class="field">
          <span class="field__label">Nama</span>
          <input class="field__input" type="text" name="nama" id="wish-nama" maxlength="60" autocomplete="name" required>
        </label>
        <fieldset class="field field--choice">
          <legend class="field__label">Konfirmasi kehadiran</legend>
          <label class="choice"><input type="radio" name="kehadiran" value="hadir" required><span>Hadir</span></label>
          <label class="choice"><input type="radio" name="kehadiran" value="ragu"><span>Masih ragu</span></label>
          <label class="choice"><input type="radio" name="kehadiran" value="tidak"><span>Tidak hadir</span></label>
        </fieldset>
        <label class="field">
          <span class="field__label">Ucapan &amp; doa</span>
          <textarea class="field__input" name="ucapan" id="wish-ucapan" rows="4" maxlength="500" required></textarea>
          <span class="field__count" id="wish-count" aria-live="polite">0 / 500</span>
        </label>
        <!-- honeypot anti-bot: disembunyikan dari manusia -->
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="wish-form__error" id="wish-error" role="alert" hidden></p>
        <button class="btn btn--ink wish-form__submit" type="submit" id="wish-submit">Kirim Ucapan</button>
      </form>

      <div class="wish-stats" id="wish-stats" data-reveal hidden></div>
      <div class="wishes" id="wishes" data-reveal aria-live="polite">
        <p class="wishes__empty" id="wishes-status">Memuat ucapan…</p>
      </div>
    </section>

    <!-- Penutup -->
    <section class="sec sec--paper penutup" id="penutup">
      <div class="wk penutup__flower" data-orn="flower" data-leaves data-bloom></div>
      <p class="penutup__text" data-reveal data-bind="teks.penutup"></p>
      <p class="penutup__salam" data-reveal data-bind="teks.salamPenutup"></p>
      <p class="penutup__sign" data-reveal>Kami yang berbahagia,</p>
      <p class="script penutup__names" data-reveal>
        <span data-urut="pria" data-bind="pria.panggilan"></span> &amp; <span data-urut="wanita" data-bind="wanita.panggilan"></span>
      </p>
      <p class="penutup__family" data-reveal>
        <span class="fam" data-urut="pria">Keluarga Besar<br><span data-bind="pria.ayah"></span> &amp; <span data-bind="pria.ibu"></span>
          <small>(<span data-bind="pria.asal"></span>)</small></span>
        <span class="fam" data-urut="wanita">Keluarga Besar<br><span data-bind="wanita.ayah"></span> &amp; <span data-bind="wanita.ibu"></span>
          <small>(<span data-bind="wanita.asal"></span>)</small></span>
      </p>
      <div class="waves penutup__waves" data-orn="waves"></div>
    </section>
  </main>

  <!-- Musik -->
  <button class="music" id="music-btn" type="button" aria-label="Putar musik" aria-pressed="false" hidden>
    <span class="music__icon" data-orn="flower-mini"></span>
  </button>
  <audio id="music" preload="none" loop></audio>

  <!-- Lightbox galeri -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto galeri" hidden>
    <button class="lightbox__close" type="button" data-lb="close" aria-label="Tutup">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" data-lb="prev" aria-label="Foto sebelumnya">&#8249;</button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" id="lightbox-img" alt="">
      <figcaption class="lightbox__count" id="lightbox-count"></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" type="button" data-lb="next" aria-label="Foto berikutnya">&#8250;</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script defer src="assets/js/data.js?v=2"></script>
  <script defer src="assets/vendor/gsap/gsap.min.js"></script>
  <script defer src="assets/vendor/gsap/ScrollTrigger.min.js"></script>
  <script defer src="assets/js/ornaments.js?v=2"></script>
  <script defer src="assets/js/main.js?v=2"></script>
  <script defer src="assets/js/motion.js?v=2"></script>
</body>
</html>
